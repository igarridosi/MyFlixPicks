<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Flix Picks</title>
    <link rel="stylesheet" href="/src/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/images/favicon_io/site.webmanifest">
  </head>
  <body class="flex justify-center bg-cover">
    <div id="app" class="container">
      <nav class="flex justify-between items-center bg-beis m-5 py-0 border-0 rounded-4xl shadow-custom">
        <div class="flex flex-row items-center w-2/5">
          <img src="/images/MyFlixPicks-Photoroom.png" alt="" class="w-[150px]">
          <h2 class="text-darkblue font-extrabold text-3xl">Explore & Save your Flix's</h2>
        </div>
        <!--
        <ul class="menu list-none flex justify-around w-2/5 text-2xl">
          <li><a href="">Home</a></li>
          <li><a href="">Page</a></li>
          <li><a href="">Menu</a></li>
          <li><a href="">About</a></li>
        </ul>
        -->

        <span id="theme-toggle" class="cursor-pointer text-4xl px-10 py-2 rounded text-white transition" aria-label="Toggle light/dark mode">🌙</span>
      </nav>
      <section class="p-6 border-0 mt-6 bg-beis m-5 py-5 rounded-4xl">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-3xl font-bold mb-4">Your Lists</h2>
          <div class="flex items-center gap-2">
            <select id="list-select" class="px-2 py-1 rounded border border-darkblue bg-beis text-darkblue"></select>
            <button id="add-list-btn" class="px-3 py-1 bg-darkblue text-white rounded hover:bg-blue-700 transition" aria-label="Add new custom list">+ New List</button>
            <button id="reload-page-btn" class="px-3 py-1 bg-dishmaster text-darkblue rounded hover:bg-yellow-300 transition" aria-label="Reload page">⟳ Reload</button>
          </div>
        </div>
        <div id="favorites" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
      </section>
      <main class="bg-beis m-5 py-0 border-0 rounded-4xl">
        <section class="p-6">
          <!-- Improved Filter and Search Bar UI -->
          <div class="flex flex-col md:flex-row items-center justify-around gap-4 mb-6 bg-beis rounded-xl shadow p-4">
            <div class="flex flex-row items-center w-full md:w-auto">
              <div class="flex flex-col">
                <label for="sort-main">Search Bar:</label>
                <input id="search-input" type="text" placeholder="Search for a movie..." class="border border-gray-300 rounded-l px-4 py-2 w-full md:w-80 focus:outline-none focus:ring-2 focus:ring-blue-400 transition" />
              </div>
              
              <button id="search-btn" class="bg-darkblue text-white px-6 py-2.5 rounded-r hover:bg-blue-700 transition font-semibold self-end">Search</button>
            </div>
            <div class="flex flex-wrap gap-4 items-center justify-end w-full md:w-auto">
              <div class="flex items-center space-x-2">
                <label for="sort-main">Sort:</label>
                <select id="sort-main" class="border border-gray-300 rounded px-2 py-1 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400 transition">
                  <option value="date-desc" selected>Date: Newest to Oldest</option>
                  <option value="date-asc">Date: Oldest to Newest</option>
                  <option value="rating-desc">Rating: High to Low</option>
                  <option value="rating-asc">Rating: Low to High</option>
                </select>
              </div>
              <div class="flex items-center space-x-2">
                <label for="filter-year">Year:</label>
                <input id="filter-year" type="number" min="1900" max="2100" placeholder="Year" class="border border-gray-300 rounded px-2 py-1 w-20 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400 transition" />
              </div>
              <div class="flex items-center space-x-2">
                <label for="filter-genre">Genre:</label>
                <select id="filter-genre" class="border border-gray-300 rounded px-2 py-1 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400 transition">
                  <option value="">All Genres</option>
                  <!-- Genres will be populated dynamically -->
                </select>
              </div>
              <div class="flex items-center space-x-2">
                <label for="filter-type">Type:</label>
                <select id="filter-type" class="border border-gray-300 rounded px-2 py-1 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400 transition">
                  <option value="all" selected>All</option>
                  <option value="movie">Movie</option>
                  <option value="tv">TV Show</option>
                  <option value="documentary">Documentary</option>
                </select>
              </div>
              <button id="toggle-favorites" class="flex items-center gap-2 bg-[#1f2833] text-[#fdf6e3] px-8 py-4 rounded-full shadow-lg font-bold hover:scale-103 hover:bg-[#232f3e] transition drop-shadow-lg ml-3">
                <span class="tracking-wide text-base">Hide Lists</span>
              </button>
            </div>

          </div>
          <!-- Loading/Error Message -->
          <div id="message" class="mb-4 text-center text-red-600"></div>
          <!-- Search Results -->
          <div>
            <h1 class="text-3xl font-bold mb-6">Trending Content</h1>
            <div id="results" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/js/main.js"></script>
    <!-- FilterBar (improved, styled like the second image, replaces old FilterBar) -->
    
    <script>
    // Toggle display filter dropdown
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('display-filter-btn');
      const dropdown = document.getElementById('display-filter-dropdown');
      if (btn && dropdown) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          dropdown.classList.toggle('hidden');
        });
        document.addEventListener('click', function() {
          dropdown.classList.add('hidden');
        });
      }
    });
    </script>
  </body>
</html>
